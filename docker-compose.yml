
services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: reportly_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - reportly
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: reportly_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - reportly
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: reportly_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_reportly
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: reportly
      MYSQL_PASSWORD: reportly123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - reportly

  redis:
    image: redis:alpine
    container_name: reportly_redis
    restart: unless-stopped
    networks:
      - reportly

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reportly_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - reportly
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    container_name: reportly_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - reportly

networks:
  reportly:
    driver: bridge

volumes:
  db_data:
